# Dependabot configuration
# This provides security alerts even if Renovate isn't enabled.
# Renovate (renovate.json) is preferred for automated PRs.

version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "vitest"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"

  # Backend (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "backend"

  # AI Pipeline (pip)
  - package-ecosystem: "pip"
    directory: "/ai-pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ai-pipeline"
    # Don't auto-update ML dependencies
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torchaudio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major"]

  # Desktop (NuGet)
  - package-ecosystem: "nuget"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "desktop"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
