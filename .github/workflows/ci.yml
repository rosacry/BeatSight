name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Detect Changes - Only run relevant jobs
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      ai-pipeline: ${{ steps.filter.outputs.ai-pipeline }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            desktop:
              - 'desktop/**'
              - '*.sln'
            ai-pipeline:
              - 'ai-pipeline/**'
            docs:
              - 'docs/**'
              - 'README.md'

  # ==========================================================================
  # Backend (FastAPI/Python)
  # ==========================================================================
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Ruff (formatting check)
        run: ruff format --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [changes, backend-lint]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: beatsight
          POSTGRES_PASSWORD: beatsight
          POSTGRES_DB: beatsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          DATABASE_DSN: postgresql+asyncpg://beatsight:beatsight@localhost:5432/beatsight_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ==========================================================================
  # Desktop (C#/.NET)
  # ==========================================================================
  desktop-build:
    name: Desktop Build
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ==========================================================================
  # AI Pipeline (Python)
  # ==========================================================================
  ai-pipeline-test:
    name: AI Pipeline Tests
    needs: changes
    if: needs.changes.outputs.ai-pipeline == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_pipeline_integration.py || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./ai-pipeline/coverage.xml
          flags: ai-pipeline
          name: ai-pipeline-coverage
          fail_ci_if_error: false

  # ==========================================================================
  # Security Scan (only on code changes)
  # ==========================================================================
  security-scan:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ai-pipeline == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities for now

  # ==========================================================================
  # Final Check (always runs, but checks only jobs that ran)
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, backend-test, desktop-build, ai-pipeline-test]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend changed: ${{ needs.changes.outputs.backend }}"
          echo "Desktop changed: ${{ needs.changes.outputs.desktop }}"
          echo "AI Pipeline changed: ${{ needs.changes.outputs.ai-pipeline }}"
          
          # Only check jobs that were supposed to run
          if [[ "${{ needs.changes.outputs.backend }}" == "true" && "${{ needs.backend-test.result }}" == "failure" ]]; then
            echo "Backend tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.changes.outputs.desktop }}" == "true" && "${{ needs.desktop-build.result }}" == "failure" ]]; then
            echo "Desktop build failed"
            exit 1
          fi
          
          if [[ "${{ needs.changes.outputs.ai-pipeline }}" == "true" && "${{ needs.ai-pipeline-test.result }}" == "failure" ]]; then
            echo "AI Pipeline tests failed"
            exit 1
          fi
          
          echo "All required jobs passed (or were skipped because no relevant changes)!"
