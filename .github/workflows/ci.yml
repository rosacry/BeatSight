name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Detect Changes - Only run relevant jobs
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      ai-pipeline: ${{ steps.filter.outputs.ai-pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai-pipeline:
              - 'ai-pipeline/**'

  # ==========================================================================
  # AI Pipeline (Python)
  # ==========================================================================
  ai-pipeline-test:
    name: AI Pipeline Tests
    needs: changes
    if: needs.changes.outputs.ai-pipeline == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_pipeline_integration.py || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./ai-pipeline/coverage.xml
          flags: ai-pipeline
          name: ai-pipeline-coverage
          fail_ci_if_error: false

  # ==========================================================================
  # Final Check
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, ai-pipeline-test]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "AI Pipeline changed: ${{ needs.changes.outputs.ai-pipeline }}"
          
          if [[ "${{ needs.changes.outputs.ai-pipeline }}" == "true" && "${{ needs.ai-pipeline-test.result }}" == "failure" ]]; then
            echo "AI Pipeline tests failed"
            exit 1
          fi
          
          echo "All required jobs passed (or were skipped because no relevant changes)!"
