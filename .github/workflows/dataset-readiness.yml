name: Dataset Readiness

on:
  push:
    paths:
      - "ai-pipeline/training/**"
      - "ai-pipeline/tests/test_dataset_health.py"
      - "ai-pipeline/tests/test_compare_reports.py"
      - ".github/workflows/dataset-readiness.yml"
  pull_request:
    paths:
      - "ai-pipeline/training/**"
      - "ai-pipeline/tests/test_dataset_health.py"
      - "ai-pipeline/tests/test_compare_reports.py"
      - ".github/workflows/dataset-readiness.yml"

jobs:
  readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if manifest exists
        id: check_manifest
        run: |
          if [ -f "ai-pipeline/training/data/manifests/prod_combined_events.jsonl" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Manifest file not found (data files are gitignored). Skipping dataset readiness checks."
          fi

      - name: Set up Python
        if: steps.check_manifest.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: steps.check_manifest.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify provenance coverage
        if: steps.check_manifest.outputs.exists == 'true'
        run: |
          python ai-pipeline/training/tools/audit_provenance.py \
            --manifest ai-pipeline/training/data/manifests/prod_combined_events.jsonl \
            --provenance-dir ai-pipeline/training/data/provenance \
            --output-json ai-pipeline/training/reports/provenance/prod_combined_provenance_audit_ci.json \
            --baseline ai-pipeline/training/reports/provenance/prod_combined_provenance_audit_baseline.json

      - name: Generate candidate health report
        if: steps.check_manifest.outputs.exists == 'true'
        run: |
          python ai-pipeline/training/dataset_health.py \
            --events ai-pipeline/training/data/events_real_v1.norm.jsonl \
            --output ai-pipeline/training/reports/health/latest_health_ci.json \
            --html-output ai-pipeline/training/reports/health/latest_health_ci.html \
            --require-label kick \
            --require-label snare \
            --require-label hihat_closed \
            --min-counts-json ai-pipeline/training/configs/health_min_counts_dev.json \
            --max-unknown-labels 0

      - name: Compare against baseline
        if: steps.check_manifest.outputs.exists == 'true'
        run: |
          python ai-pipeline/training/compare_health_reports.py \
            --baseline ai-pipeline/training/reports/health/baseline.json \
            --candidate ai-pipeline/training/reports/health/latest_health_ci.json \
            --max-drop 0 \
            --json-output ai-pipeline/training/reports/health/latest_vs_baseline_ci.json

      - name: Run targeted readiness tests
        if: steps.check_manifest.outputs.exists == 'true'
        run: |
          pytest ai-pipeline/tests/test_dataset_health.py ai-pipeline/tests/test_compare_reports.py

      - name: Upload health artifacts
        if: steps.check_manifest.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dataset-health
          path: |
            ai-pipeline/training/reports/health/latest_health_ci.json
            ai-pipeline/training/reports/health/latest_health_ci.html
            ai-pipeline/training/reports/health/latest_vs_baseline_ci.json
            ai-pipeline/training/reports/provenance/prod_combined_provenance_audit_ci.json

      - name: Report skipped
        if: steps.check_manifest.outputs.exists == 'false'
        run: |
          echo "✅ Dataset readiness checks skipped - manifest data not present in repository"
          echo "This is expected behavior as training data files are gitignored."
