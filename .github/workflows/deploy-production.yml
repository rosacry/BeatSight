# =============================================================================
# BeatSight Production Deployment
# =============================================================================
# Deploys:
#   - Frontend → Cloudflare Pages (beatsight.io)
#   - Backend API → Railway (api.beatsight.io)
#   - Docs → Cloudflare Pages (docs.beatsight.io)
# =============================================================================

name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs-site/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy Frontend'
        type: boolean
        default: true
      deploy_backend:
        description: 'Deploy Backend'
        type: boolean
        default: true
      deploy_docs:
        description: 'Deploy Docs'
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Determine What to Deploy
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            docs:
              - 'docs-site/**'

  # ==========================================================================
  # Deploy Frontend to Cloudflare Pages
  # ==========================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.frontend == 'true')
    
    environment:
      name: production-frontend
      url: https://beatsight.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.beatsight.io
          VITE_APP_NAME: BeatSight
          VITE_ENABLE_PWA: 'true'
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=beatsight --branch=main

      - name: Deployment Summary
        run: |
          echo "## 🚀 Frontend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://beatsight.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Deploy Backend to Railway
  # ==========================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true')
    
    environment:
      name: production-backend
      url: https://api.beatsight.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service beatsight-api --detach

      - name: Deployment Summary
        run: |
          echo "## 🚀 Backend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://api.beatsight.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Deploy Docs to Cloudflare Pages
  # ==========================================================================
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_docs == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.docs == 'true')
    
    environment:
      name: production-docs
      url: https://docs.beatsight.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/build --project-name=beatsight-docs --branch=main

      - name: Deployment Summary
        run: |
          echo "## 📚 Docs Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://docs.beatsight.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Post-Deployment Health Checks
  # ==========================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && (needs.deploy-frontend.result == 'success' || needs.deploy-backend.result == 'success')
    
    steps:
      - name: Wait for deployments to propagate
        run: sleep 30

      - name: Check Frontend Health
        if: needs.deploy-frontend.result == 'success'
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://beatsight.io)
          if [ "$response" -eq 200 ]; then
            echo "✅ Frontend is healthy (HTTP $response)"
          else
            echo "⚠️ Frontend returned HTTP $response"
            exit 1
          fi

      - name: Check Backend Health
        if: needs.deploy-backend.result == 'success'
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://api.beatsight.io/health)
          if [ "$response" -eq 200 ]; then
            echo "✅ Backend is healthy (HTTP $response)"
          else
            echo "⚠️ Backend returned HTTP $response"
            exit 1
          fi

      - name: Health Check Summary
        run: |
          echo "## ✅ Health Checks Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All deployed services are responding correctly." >> $GITHUB_STEP_SUMMARY
