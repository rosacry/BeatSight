# =============================================================================
# BeatSight Production Deployment
# =============================================================================
# Deploys:
#   - Frontend → Cloudflare Pages (beatsight.io) - via Cloudflare Git integration
#   - Backend API → Railway (api.beatsight.io) - via Railway Git integration
#   - Docs → Cloudflare Pages (docs.beatsight.io) - via GitHub Actions
# =============================================================================

name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs-site/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend'
        type: boolean
        default: true
      deploy_docs:
        description: 'Deploy Docs'
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Determine What to Deploy
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            docs:
              - 'docs-site/**'

  # ==========================================================================
  # Frontend: Deployed via Cloudflare Pages Git Integration
  # ==========================================================================
  # NOTE: Frontend is automatically deployed by Cloudflare Pages when you push.
  # Configure in Cloudflare Dashboard → Pages → beatsight → Settings → Builds:
  #   - Build command: npm run build
  #   - Build output directory: dist  
  #   - Root directory: frontend
  #   - Environment variables: VITE_API_BASE_URL=https://api.beatsight.io
  # ==========================================================================

  # ==========================================================================
  # Deploy Backend to Railway
  # ==========================================================================
  # NOTE: Railway automatically deploys from GitHub when you push to main.
  # This job just waits for and verifies the deployment.
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true')
    
    environment:
      name: production-backend
      url: https://api.beatsight.io

    steps:
      - name: Wait for Railway Auto-Deploy
        run: |
          echo "Railway automatically deploys from GitHub push."
          echo "Waiting for deployment to propagate..."
          sleep 30

      - name: Verify Deployment Health
        run: |
          echo "Checking API health..."
          for i in {1..10}; do
            if curl -sf https://api.beatsight.io/health/live > /dev/null 2>&1; then
              echo "✅ API is healthy!"
              exit 0
            fi
            echo "Attempt $i/10: API not ready, waiting..."
            sleep 10
          done
          echo "⚠️ Health check timed out, but Railway may still be deploying"
          # Don't fail the job - Railway handles its own deployment
          exit 0

      - name: Deployment Summary
        run: |
          echo "## 🚀 Backend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://api.beatsight.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Health**: https://api.beatsight.io/health/live" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Deploy Docs to Cloudflare Pages
  # ==========================================================================
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_docs == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.docs == 'true')
    
    environment:
      name: production-docs
      url: https://docs.beatsight.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build
        working-directory: docs-site
        run: npm run build

      - name: Create Cloudflare Pages project if needed
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create beatsight-docs --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/build --project-name=beatsight-docs --branch=main --commit-dirty=true

      - name: Deployment Summary
        run: |
          echo "## 📚 Docs Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://docs.beatsight.io" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Post-Deployment Health Checks
  # ==========================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: always() && needs.deploy-backend.result == 'success'
    
    steps:
      - name: Wait for deployments to propagate
        run: sleep 30

      - name: Check Frontend Health
        continue-on-error: true  # Frontend deployed by Cloudflare, may not be ready
        run: |
          # Use user-agent header to avoid bot detection
          response=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (GitHub Actions Health Check)" https://beatsight.io)
          if [ "$response" -eq 200 ] || [ "$response" -eq 403 ]; then
            echo "✅ Frontend is reachable (HTTP $response)"
          else
            echo "⚠️ Frontend returned HTTP $response - may still be deploying via Cloudflare"
          fi

      - name: Check Backend Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://api.beatsight.io/health/live)
          if [ "$response" -eq 200 ]; then
            echo "✅ Backend is healthy (HTTP $response)"
          else
            echo "⚠️ Backend returned HTTP $response"
            exit 1
          fi

      - name: Health Check Summary
        run: |
          echo "## ✅ Health Checks Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All deployed services are responding correctly." >> $GITHUB_STEP_SUMMARY
