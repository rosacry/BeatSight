name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ==========================================================================
  # Build Docker Image
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      # Use the first tag (SHA-based) to avoid multi-line output issues in shell commands
      image_tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ==========================================================================
  # Deploy to Staging
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging-api.beatsight.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run database migrations first
      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations..."
          # In real deployment, this would SSH to staging server or run migration container:
          # docker run --rm \
          #   -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
          #   ${{ needs.build.outputs.image_tag }} \
          #   alembic upgrade head
          echo "✅ Migrations complete (placeholder - uncomment for real deployments)"

      # Azure deployment example (uncomment and configure)
      # - name: Azure Login
      #   uses: azure/login@v1
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      #
      # - name: Deploy to Azure Container Apps
      #   uses: azure/container-apps-deploy-action@v1
      #   with:
      #     acrName: beatsightacr
      #     containerAppName: beatsight-api-staging
      #     resourceGroup: beatsight-staging-rg
      #     imageToDeploy: ${{ needs.build.outputs.image_tag }}

      - name: Deployment notification
        run: |
          echo "🚀 Deployed to staging environment"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"

  # ==========================================================================
  # Deploy to Production
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://api.beatsight.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure deployment example (uncomment and configure)
      # - name: Azure Login
      #   uses: azure/login@v1
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      #
      # - name: Deploy to Azure Container Apps
      #   uses: azure/container-apps-deploy-action@v1
      #   with:
      #     acrName: beatsightacr
      #     containerAppName: beatsight-api-prod
      #     resourceGroup: beatsight-prod-rg
      #     imageToDeploy: ${{ needs.build.outputs.image_tag }}

      - name: Production deployment notification
        run: |
          echo "🎉 Deployed to production environment"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"

  # ==========================================================================
  # Post-Deploy Health Check
  # ==========================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always() && needs.deploy-staging.result == 'success'

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check API health
        run: |
          HEALTH_URL="${{ github.event.inputs.environment == 'production' && 'https://api.beatsight.io' || 'https://staging-api.beatsight.io' }}/health"
          echo "Checking health at: $HEALTH_URL"
          
          # Retry up to 5 times
          for i in {1..5}; do
            if curl -sf "$HEALTH_URL" > /dev/null; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1
        continue-on-error: true  # Don't fail the workflow for now

  # ==========================================================================
  # Smoke Tests
  # ==========================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging, health-check]
    if: always() && needs.health-check.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          pip install httpx pytest

      - name: Run smoke tests
        env:
          API_URL: ${{ github.event.inputs.environment == 'production' && 'https://api.beatsight.io' || 'https://staging-api.beatsight.io' }}
        run: |
          echo "🔥 Running smoke tests against $API_URL"
          python -c "
          import httpx
          import sys
          
          api_url = '$API_URL'
          
          tests = [
              ('GET', '/health', 200),
              ('GET', '/api/quota', 200),  # Anonymous quota check
              ('GET', '/openapi.json', 200),
          ]
          
          passed = 0
          failed = 0
          
          for method, path, expected_status in tests:
              url = f'{api_url}{path}'
              try:
                  response = httpx.request(method, url, timeout=10)
                  if response.status_code == expected_status:
                      print(f'✅ {method} {path} -> {response.status_code}')
                      passed += 1
                  else:
                      print(f'❌ {method} {path} -> {response.status_code} (expected {expected_status})')
                      failed += 1
              except Exception as e:
                  print(f'❌ {method} {path} -> ERROR: {e}')
                  failed += 1
          
          print(f'\nResults: {passed} passed, {failed} failed')
          sys.exit(1 if failed > 0 else 0)
          "
        continue-on-error: true  # Don't fail the workflow for now
