name: Desktop CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'desktop/**'
      - 'scripts/run_visual_regression_chunked.ps1'
      - 'scripts/visual_regression_rollup_helpers.ps1'
      - 'scripts/compare_visual_rollups.ps1'
      - 'scripts/evaluate_visual_rollup.ps1'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'desktop/**'
      - 'scripts/run_visual_regression_chunked.ps1'
      - 'scripts/visual_regression_rollup_helpers.ps1'
      - 'scripts/compare_visual_rollups.ps1'
      - 'scripts/evaluate_visual_rollup.ps1'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore BeatSight.sln
      
      - name: Build
        run: dotnet build BeatSight.sln --no-restore --configuration Release
      
      - name: Run tests with coverage
        run: dotnet test desktop/BeatSight.Tests/BeatSight.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Run live visual regression (chunked)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & ./scripts/run_visual_regression_chunked.ps1 `
            -ProjectPath 'desktop/BeatSight.Tests/BeatSight.Tests.csproj' `
            -Configuration 'Release' `
            -SkipInitialBuild `
            -HeartbeatSeconds 20 `
            -BatchTimeoutSeconds 1200

      - name: Evaluate visual rollup gate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & ./scripts/evaluate_visual_rollup.ps1 `
            -ResultsDirectory 'desktop/BeatSight.Tests/TestResults/visual-chunked' `
            -MaxTotalP95Seconds 300 `
            -MaxStartupP95Seconds 180 `
            -MaxTrxMissingRatio 0.30 `
            -FailOnThresholdBreach

      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.os }}
          path: desktop/BeatSight.Tests/TestResults/visual-diff/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload visual rollup artifacts
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: visual-rollup-${{ matrix.os }}
          path: |
            desktop/BeatSight.Tests/TestResults/visual-chunked/visual_rollup_*.json
            desktop/BeatSight.Tests/TestResults/visual-chunked/*.trx
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/**/coverage.cobertura.xml
          flags: desktop
          name: desktop-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Publish
        run: dotnet publish desktop/BeatSight.Desktop/BeatSight.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: beatsight-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 30
