# Nixpacks configuration for BeatSight Backend
# https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["python312", "postgresql", "coreutils", "bash"]

[phases.install]
dependsOn = ["setup"]
onlyIncludeFiles = ["pyproject.toml", "README.md", "app", "alembic", "alembic.ini", "scripts"]
cmds = [
    "python3 -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip",
    ". /opt/venv/bin/activate && pip install ."
]

[variables]
PATH = "/opt/venv/bin:${PATH}"
PORT = "8000"

[start]
# Fix old revision names in alembic_version table, then run migrations before starting the server
cmd = "python scripts/fix_alembic_versions.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
