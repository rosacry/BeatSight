[tool.poetry]
name = "beatsight-backend"
version = "0.1.0"
description = "BeatSight web backend services"
authors = ["BeatSight Team <team@beatsight.io>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = {version = "^2.7.0", extras = ["email"]}
pydantic-settings = "^2.5.2"
sqlalchemy = { version = "^2.0.25", extras = ["asyncio"] }
asyncpg = "^0.29.0"
psycopg = { version = "^3.1.18", extras = ["binary"] }
alembic = "^1.13.1"
redis = "^5.0.1"
python-multipart = "^0.0.6"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
bcrypt = ">=4.0.0,<4.2.0"  # Pin bcrypt < 4.2 for passlib compatibility
argon2-cffi = "^23.1.0"
cryptography = "^42.0.0"
structlog = "^24.1.0"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
prometheus-client = "^0.21.0"
stripe = "^8.0.0"
sendgrid = "^6.11.0"
pywebpush = "^2.0.0"
sentry-sdk = { version = "^2.0.0", extras = ["fastapi"] }
aiofiles = "^24.1.0"
pyotp = "^2.9.0"  # TOTP for Two-Factor Authentication
qrcode = { version = "^8.2.0", extras = ["pil"] }  # QR code generation for 2FA setup
httpx = "^0.27.0"  # HTTP client for external API calls

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.3"
httpx = "^0.27.0"
pre-commit = "^3.6.0"
ruff = "^0.1.11"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

# PEP 621 compatibility for pip install -e ".[dev]"
[project]
name = "beatsight-backend"
version = "0.1.0"
description = "BeatSight web backend services"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.5.2",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "redis>=5.0.1",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.2.0",  # Pin bcrypt < 4.2 for passlib compatibility
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "prometheus-client>=0.21.0",
    "stripe>=8.0.0",
    "sendgrid>=6.11.0",
    "pywebpush>=2.0.0",
    "Pillow>=10.0.0",
    "aiofiles>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "pre-commit>=3.6.0",
    "ruff>=0.1.11",
]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]
