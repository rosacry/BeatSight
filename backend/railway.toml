# =============================================================================
# Railway Configuration for BeatSight Backend API
# =============================================================================
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Let Railway auto-detect (Nixpacks for Python)
builder = "NIXPACKS"

[deploy]
# Run migrations with explicit error output, then start the server
startCommand = "cd /app && python -m alembic upgrade head 2>&1 && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
