# =============================================================================
# Railway Configuration for BeatSight Backend API
# =============================================================================
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Let Railway auto-detect the Dockerfile

[deploy]
# Minimal test - just try to start Python and see output
startCommand = "python --version && echo PORT=$PORT && python -c 'import sys; print(sys.version); print(\"Testing stdout flush\", flush=True)' && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
