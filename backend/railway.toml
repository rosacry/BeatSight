# =============================================================================
# Railway Configuration for BeatSight Backend API
# =============================================================================
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Let Railway auto-detect the Dockerfile

[deploy]
# Start with debug output to diagnose startup issues
startCommand = "echo 'Starting...' && python -c 'print(\"Python OK\"); import app.main; print(\"Import OK\")' && uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level debug"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
