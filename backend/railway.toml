# =============================================================================
# Railway Configuration for BeatSight Backend API
# =============================================================================
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Let Railway auto-detect (Nixpacks for Python)
builder = "NIXPACKS"

[deploy]
# Start command is defined in nixpacks.toml
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
