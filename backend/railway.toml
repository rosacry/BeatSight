# =============================================================================
# Railway Configuration for BeatSight Backend API
# =============================================================================
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Let Railway auto-detect the Dockerfile

[deploy]
# Run migrations then start the server with verbose logging
startCommand = "python -m alembic upgrade head && echo 'Migrations complete, starting uvicorn...' && uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level info"
healthcheckPath = "/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
