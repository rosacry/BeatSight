# =============================================================================
# Railway Configuration for BeatSight Backend API
# =============================================================================
# Docs: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
# Let Railway auto-detect the Dockerfile

[deploy]
# Start uvicorn directly - migrations are already applied
startCommand = "echo 'Starting uvicorn...' && uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level info"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
