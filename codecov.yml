# Codecov Configuration for BeatSight
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...100"
  
  status:
    project:
      default:
        target: auto
        threshold: 2%  # Allow 2% coverage drop
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%

  # Ignore certain paths from coverage
  ignore:
    - "**/__pycache__/**"
    - "**/tests/**"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/conftest.py"
    - "**/migrations/**"
    - "**/alembic/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "docs/**"
    - "scripts/**"
    - "tools/**"

# Flag management for different components
flags:
  backend:
    paths:
      - backend/app/
    carryforward: true
    after_n_builds: 1
  
  desktop:
    paths:
      - desktop/BeatSight.Game/
      - desktop/BeatSight.Desktop/
    carryforward: true
    after_n_builds: 1

  frontend:
    paths:
      - frontend/src/
    carryforward: true
    after_n_builds: 1

  ai-pipeline:
    paths:
      - ai-pipeline/
    carryforward: true
    after_n_builds: 1

# Comment configuration for PRs
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# GitHub Checks integration
github_checks:
  annotations: true
