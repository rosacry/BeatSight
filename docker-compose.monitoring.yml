# BeatSight Local Monitoring Stack
# Run: docker-compose -f docker-compose.monitoring.yml up -d
#
# Access:
#   Grafana:    http://localhost:3001 (admin/beatsight)
#   Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: beatsight-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'  # Enable /-/reload endpoint
    networks:
      - beatsight-monitoring

  grafana:
    image: grafana/grafana:10.2.0
    container_name: beatsight-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=beatsight
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      # Auto-provision datasources and dashboards
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - beatsight-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  beatsight-monitoring:
    driver: bridge
