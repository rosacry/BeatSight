# BeatSight Documentation Site Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beatsight-docs
  namespace: beatsight
  labels:
    app: beatsight-docs
    app.kubernetes.io/name: beatsight-docs
    app.kubernetes.io/component: docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beatsight-docs
  template:
    metadata:
      labels:
        app: beatsight-docs
    spec:
      containers:
        - name: docs
          image: ghcr.io/rosacry/beatsight-docs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: beatsight-docs
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: beatsight-docs
  namespace: beatsight
  labels:
    app: beatsight-docs
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: beatsight-docs
