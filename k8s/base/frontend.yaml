apiVersion: apps/v1
kind: Deployment
metadata:
  name: beatsight-frontend
  namespace: beatsight
  labels:
    app: beatsight-frontend
    app.kubernetes.io/name: beatsight-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beatsight-frontend
  template:
    metadata:
      labels:
        app: beatsight-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/rosacry/beatsight-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: beatsight-frontend
  namespace: beatsight
  labels:
    app: beatsight-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: beatsight-frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: beatsight-frontend
  namespace: beatsight
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beatsight-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: beatsight-frontend-pdb
  namespace: beatsight
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: beatsight-frontend
