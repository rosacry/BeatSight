apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beatsight-ingress
  namespace: beatsight
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # HSTS - enforce HTTPS for 1 year, include subdomains, allow preloading
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
spec:
  tls:
    - hosts:
        - beatsight.io
        - www.beatsight.io
        - api.beatsight.io
        - docs.beatsight.io
      secretName: beatsight-tls
  rules:
    # API backend
    - host: api.beatsight.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beatsight-backend
                port:
                  number: 8000
    # Main frontend
    - host: beatsight.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beatsight-frontend
                port:
                  number: 80
    # WWW redirect handled by frontend nginx config
    - host: www.beatsight.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beatsight-frontend
                port:
                  number: 80
    # Documentation site
    - host: docs.beatsight.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beatsight-docs
                port:
                  number: 80
---
# Certificate issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@beatsight.io
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
