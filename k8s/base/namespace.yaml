apiVersion: v1
kind: Namespace
metadata:
  name: beatsight
  labels:
    app.kubernetes.io/name: beatsight
    app.kubernetes.io/part-of: beatsight
---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: beatsight-config
  namespace: beatsight
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CORS_ALLOWED_ORIGINS: '["https://beatsight.io","https://www.beatsight.io"]'
  RATE_LIMIT_ENABLED: "true"
  FEATURE_COMMUNITY: "true"
  FEATURE_KARMA: "true"
# Note: beatsight-secrets should be created manually or via external-secrets
# kubectl create secret generic beatsight-secrets -n beatsight \
#   --from-literal=DB_PASSWORD='your-password' \
#   --from-literal=JWT_SECRET='your-jwt-secret'
