# External Secrets Configuration
# ===============================
# This allows pulling secrets from external providers (AWS Secrets Manager, 
# HashiCorp Vault, GCP Secret Manager, Azure Key Vault, etc.)
#
# Prerequisites:
# 1. Install External Secrets Operator:
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# 2. Configure a SecretStore for your provider (examples below)

---
# Option 1: AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: beatsight
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Use IAM role for service account (recommended)
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
# Option 2: HashiCorp Vault
# apiVersion: external-secrets.io/v1beta1
# kind: SecretStore
# metadata:
#   name: vault-backend
#   namespace: beatsight
# spec:
#   provider:
#     vault:
#       server: "https://vault.example.com"
#       path: "secret"
#       version: "v2"
#       auth:
#         kubernetes:
#           mountPath: "kubernetes"
#           role: "beatsight"

---
# ExternalSecret - Pulls secrets from the configured store
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: beatsight-secrets
  namespace: beatsight
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager  # or vault-backend
    kind: SecretStore
  target:
    name: beatsight-secrets
    creationPolicy: Owner
  data:
    # Database
    - secretKey: DATABASE_URL
      remoteRef:
        key: beatsight/production
        property: DATABASE_URL
    
    - secretKey: REDIS_URL
      remoteRef:
        key: beatsight/production
        property: REDIS_URL
    
    # Auth
    - secretKey: JWT_SECRET
      remoteRef:
        key: beatsight/production
        property: JWT_SECRET
    
    # Sentry
    - secretKey: SENTRY_DSN
      remoteRef:
        key: beatsight/production
        property: SENTRY_DSN
    
    - secretKey: SENTRY_AUTH_TOKEN
      remoteRef:
        key: beatsight/production
        property: SENTRY_AUTH_TOKEN
    
    # Grafana
    - secretKey: GRAFANA_CLOUD_INSTANCE_ID
      remoteRef:
        key: beatsight/production
        property: GRAFANA_CLOUD_INSTANCE_ID
    
    - secretKey: GRAFANA_CLOUD_API_KEY
      remoteRef:
        key: beatsight/production
        property: GRAFANA_CLOUD_API_KEY
    
    # Stripe
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: beatsight/production
        property: STRIPE_SECRET_KEY
    
    - secretKey: STRIPE_PUBLISHABLE_KEY
      remoteRef:
        key: beatsight/production
        property: STRIPE_PUBLISHABLE_KEY
    
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: beatsight/production
        property: STRIPE_WEBHOOK_SECRET
    
    - secretKey: STRIPE_PRO_MONTHLY_PRICE_ID
      remoteRef:
        key: beatsight/production
        property: STRIPE_PRO_MONTHLY_PRICE_ID
    
    - secretKey: STRIPE_PRO_YEARLY_PRICE_ID
      remoteRef:
        key: beatsight/production
        property: STRIPE_PRO_YEARLY_PRICE_ID
    
    - secretKey: STRIPE_CREDITS_15_PRICE_ID
      remoteRef:
        key: beatsight/production
        property: STRIPE_CREDITS_15_PRICE_ID
    
    - secretKey: STRIPE_CREDITS_30_PRICE_ID
      remoteRef:
        key: beatsight/production
        property: STRIPE_CREDITS_30_PRICE_ID
    
    - secretKey: STRIPE_CREDITS_75_PRICE_ID
      remoteRef:
        key: beatsight/production
        property: STRIPE_CREDITS_75_PRICE_ID
    
    # S3
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: beatsight/production
        property: AWS_ACCESS_KEY_ID
    
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: beatsight/production
        property: AWS_SECRET_ACCESS_KEY
    
    # Modal
    - secretKey: MODAL_TOKEN_ID
      remoteRef:
        key: beatsight/production
        property: MODAL_TOKEN_ID
    
    - secretKey: MODAL_TOKEN_SECRET
      remoteRef:
        key: beatsight/production
        property: MODAL_TOKEN_SECRET
