# Cloud SQL Proxy Sidecar Configuration
# This allows your pods to connect to Cloud SQL securely

apiVersion: v1
kind: ServiceAccount
metadata:
  name: beatsight-backend-sa
  namespace: beatsight
  annotations:
    iam.gke.io/gcp-service-account: beatsight-sql@beatsight.iam.gserviceaccount.com

---
# Backend deployment with Cloud SQL Proxy sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beatsight-backend
  namespace: beatsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beatsight-backend
  template:
    metadata:
      labels:
        app: beatsight-backend
    spec:
      serviceAccountName: beatsight-backend-sa
      containers:
        # Main application container
        - name: beatsight-backend
          image: ghcr.io/rosacry/beatsight-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://beatsight:$(DB_PASSWORD)@localhost:5432/beatsight"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beatsight-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: beatsight-secrets
                  key: JWT_SECRET
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: beatsight-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
              ephemeral-storage: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
        
        # Cloud SQL Proxy sidecar
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "beatsight:us-central1:beatsight-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# Workload Identity binding (run this command separately)
# gcloud iam service-accounts create beatsight-sql --display-name="BeatSight SQL Access"
# gcloud projects add-iam-policy-binding beatsight \
#   --member="serviceAccount:beatsight-sql@beatsight.iam.gserviceaccount.com" \
#   --role="roles/cloudsql.client"
# gcloud iam service-accounts add-iam-policy-binding beatsight-sql@beatsight.iam.gserviceaccount.com \
#   --member="serviceAccount:beatsight.svc.id.goog[beatsight/beatsight-backend-sa]" \
#   --role="roles/iam.workloadIdentityUser"
