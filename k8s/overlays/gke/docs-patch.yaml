# GKE Autopilot patch for docs deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beatsight-docs
  namespace: beatsight
spec:
  template:
    spec:
      containers:
        - name: docs
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "128Mi"
              cpu: "200m"
              ephemeral-storage: "500Mi"
