# BeatSight Kubernetes Secrets Template
# =====================================
# 
# INSTRUCTIONS:
# 1. Copy this file: cp secrets.template.yaml secrets.yaml
# 2. Fill in all the values (replace <PLACEHOLDER> entries)
# 3. Apply: kubectl apply -f secrets.yaml
# 4. NEVER commit secrets.yaml to git!
#
# For production, consider using:
# - Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
# - External Secrets: https://external-secrets.io/
# - HashiCorp Vault: https://www.vaultproject.io/

apiVersion: v1
kind: Secret
metadata:
  name: beatsight-secrets
  namespace: beatsight
type: Opaque
stringData:
  # ===================
  # DATABASE
  # ===================
  # PostgreSQL connection string
  # Format: postgresql://user:password@host:port/database
  DATABASE_URL: "<YOUR_POSTGRES_CONNECTION_STRING>"
  
  # Redis connection (optional, for caching/queues)
  # Format: redis://[:password@]host:port/db
  REDIS_URL: "redis://localhost:6379/0"

  # ===================
  # AUTHENTICATION
  # ===================
  # JWT signing secret - KEEP THIS SECURE!
  # Generated value (you can use this or generate your own):
  JWT_SECRET: "P106OFjMpU6X7BF2SjJn25/tDDV7Qd6RNCtseX6KAvY="
  
  # Session secret for cookies
  SESSION_SECRET: "<GENERATE_ANOTHER_32_CHAR_SECRET>"

  # ===================
  # EXTERNAL SERVICES
  # ===================
  
  # Sentry (Error Monitoring)
  SENTRY_DSN: "<YOUR_SENTRY_DSN>"
  SENTRY_AUTH_TOKEN: "<YOUR_SENTRY_AUTH_TOKEN>"
  SENTRY_ORG: "<YOUR_SENTRY_ORG_SLUG>"
  
  # Grafana Cloud (Metrics)
  GRAFANA_CLOUD_INSTANCE_ID: "<YOUR_INSTANCE_ID>"
  GRAFANA_CLOUD_API_KEY: "<YOUR_API_KEY>"
  GRAFANA_CLOUD_OTLP_ENDPOINT: "https://otlp-gateway-prod-us-central-0.grafana.net/otlp"
  
  # Stripe (Payments)
  STRIPE_SECRET_KEY: "<YOUR_STRIPE_SECRET_KEY>"
  STRIPE_PUBLISHABLE_KEY: "<YOUR_STRIPE_PUBLISHABLE_KEY>"
  STRIPE_WEBHOOK_SECRET: "<YOUR_STRIPE_WEBHOOK_SECRET>"
  STRIPE_PRO_MONTHLY_PRICE_ID: "<YOUR_PRO_MONTHLY_PRICE_ID>"
  STRIPE_PRO_YEARLY_PRICE_ID: "<YOUR_PRO_YEARLY_PRICE_ID>"
  STRIPE_CREDITS_15_PRICE_ID: "<YOUR_CREDITS_15_PRICE_ID>"
  STRIPE_CREDITS_30_PRICE_ID: "<YOUR_CREDITS_30_PRICE_ID>"
  STRIPE_CREDITS_75_PRICE_ID: "<YOUR_CREDITS_75_PRICE_ID>"

  # ===================
  # STORAGE
  # ===================
  
  # S3-compatible storage (for audio files)
  S3_BUCKET: "beatsight-storage"
  S3_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "<YOUR_AWS_ACCESS_KEY>"
  AWS_SECRET_ACCESS_KEY: "<YOUR_AWS_SECRET_KEY>"
  # Or for other S3-compatible services:
  S3_ENDPOINT: ""  # e.g., https://s3.us-west-1.wasabisys.com

  # ===================
  # AI PIPELINE
  # ===================
  
  # Modal.com (for serverless GPU inference)
  MODAL_TOKEN_ID: "<YOUR_MODAL_TOKEN_ID>"
  MODAL_TOKEN_SECRET: "<YOUR_MODAL_TOKEN_SECRET>"
  
  # Weights & Biases (ML experiment tracking)
  WANDB_API_KEY: "<YOUR_WANDB_API_KEY>"

---
# Image pull secret for private container registry (if needed)
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: beatsight
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker config JSON
  # Generate with: kubectl create secret docker-registry ghcr-credentials \
  #   --docker-server=ghcr.io \
  #   --docker-username=<github-username> \
  #   --docker-password=<github-pat> \
  #   --dry-run=client -o yaml
  .dockerconfigjson: "<BASE64_ENCODED_DOCKER_CONFIG>"
